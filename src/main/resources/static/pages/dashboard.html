<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Communication Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body id="dashboard-page">
    <div id="alert-container" class="alert-container"></div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/pages/dashboard.html">CommPlatform</a>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white-50">Welcome, <strong id="nav-user" class="text-white">User</strong></span>
                <a href="#" id="logout-btn" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 dashboard-sidebar">
                <h6>Navigation</h6>
                <nav class="nav flex-column sidebar-nav">
                    <a class="nav-link active" href="/pages/dashboard.html">Dashboard</a>
                    <a class="nav-link" href="/pages/communities.html">Communities</a>
                    <a class="nav-link" href="/pages/channels.html">Channels</a>
                    <a class="nav-link" href="/pages/messages.html">Messages</a>
                    <a class="nav-link" href="/pages/files.html">Files</a>
                    <a class="nav-link" href="/pages/search.html">Search</a>
                </nav>
            </div>

            <div class="col-md-9 col-lg-10 page-container">
                <h2 class="mb-4">Dashboard</h2>

                <div class="row g-3 mb-4">
                    <div class="col-md-3">
                        <div class="card stat-card p-3">
                            <small class="text-muted">Logged in as</small>
                            <div class="stat-value" id="welcome-user">-</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card stat-card p-3">
                            <small class="text-muted">User ID</small>
                            <div class="stat-value" id="user-id">-</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card stat-card p-3">
                            <small class="text-muted">Role</small>
                            <div class="stat-value" id="user-role">-</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card stat-card p-3">
                            <small class="text-muted">Email</small>
                            <div class="stat-value fs-6" id="user-email">-</div>
                        </div>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col-lg-6">
                        <div class="card content-card">
                            <div class="card-header">All Users</div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-hover mb-0">
                                        <thead>
                                            <tr>
                                                <th>ID</th>
                                                <th>Username</th>
                                                <th>Email</th>
                                                <th>Role</th>
                                            </tr>
                                        </thead>
                                        <tbody id="users-table-body">
                                            <tr><td colspan="4" class="text-center text-muted">Loading...</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div class="card content-card">
                            <div class="card-header">Update User Role</div>
                            <div class="card-body">
                                <form id="role-update-form">
                                    <div class="mb-3">
                                        <label for="update-user-id" class="form-label">User ID</label>
                                        <input type="number" class="form-control" id="update-user-id" name="userId" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="update-role" class="form-label">Role</label>
                                        <select class="form-select" id="update-role" name="role" required>
                                            <option value="MEMBER">MEMBER</option>
                                            <option value="MODERATOR">MODERATOR</option>
                                            <option value="ADMIN">ADMIN</option>
                                        </select>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Update Role</button>
                                </form>
                            </div>
                        </div>

                        <div class="card content-card">
                            <div class="card-header">Get User Role</div>
                            <div class="card-body">
                                <form id="role-lookup-form">
                                    <div class="mb-3">
                                        <label for="role-user-id" class="form-label">User ID</label>
                                        <input type="number" class="form-control" id="role-user-id" required>
                                    </div>
                                    <button type="submit" class="btn btn-outline-primary">Get Role</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card content-card mt-2">
                    <div class="card-header">API Response</div>
                    <div class="card-body">
                        <pre id="users-response" class="api-response mb-0">{}</pre>
                        <pre id="role-response" class="api-response mt-3 mb-0">{}</pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
