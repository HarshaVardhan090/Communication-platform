<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Communication Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body id="messages-page">
    <div id="alert-container" class="alert-container"></div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/pages/dashboard.html">CommPlatform</a>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white-50">Welcome, <strong id="nav-user" class="text-white">User</strong></span>
                <a href="#" id="logout-btn" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 dashboard-sidebar">
                <h6>Navigation</h6>
                <nav class="nav flex-column sidebar-nav">
                    <a class="nav-link" href="/pages/dashboard.html">Dashboard</a>
                    <a class="nav-link" href="/pages/communities.html">Communities</a>
                    <a class="nav-link" href="/pages/channels.html">Channels</a>
                    <a class="nav-link active" href="/pages/messages.html">Messages</a>
                    <a class="nav-link" href="/pages/files.html">Files</a>
                    <a class="nav-link" href="/pages/search.html">Search</a>
                </nav>
            </div>

            <div class="col-md-9 col-lg-10 page-container">
                <h2 class="mb-4">Messages</h2>

                <div class="row g-4">
                    <div class="col-lg-5">
                        <div class="card content-card">
                            <div class="card-header">Send Message</div>
                            <div class="card-body">
                                <form id="message-form">
                                    <div class="mb-3">
                                        <label for="content" class="form-label">Message</label>
                                        <textarea class="form-control" id="content" name="content" rows="4" required></textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label for="receiverId" class="form-label">Receiver ID (optional)</label>
                                        <input type="number" class="form-control" id="receiverId" name="receiverId">
                                        <small class="text-muted">For direct messages</small>
                                    </div>
                                    <div class="mb-3">
                                        <label for="channelId" class="form-label">Channel ID (optional)</label>
                                        <input type="number" class="form-control" id="channelId" name="channelId">
                                        <small class="text-muted">For channel messages</small>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Send Message</button>
                                </form>
                            </div>
                        </div>

                        <div class="card content-card">
                            <div class="card-header">Messages by Channel</div>
                            <div class="card-body">
                                <form id="message-lookup-form">
                                    <div class="mb-3">
                                        <label for="message-channel-id" class="form-label">Channel ID</label>
                                        <input type="number" class="form-control" id="message-channel-id" required>
                                    </div>
                                    <button type="submit" class="btn btn-outline-primary">Load Messages</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-7">
                        <div class="card content-card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span>All Messages</span>
                                <button class="btn btn-sm btn-outline-primary" onclick="loadMessages()">Refresh</button>
                            </div>
                            <div class="card-body">
                                <div id="messages-list">
                                    <p class="text-muted mb-0">Loading...</p>
                                </div>
                            </div>
                        </div>

                        <div class="card content-card">
                            <div class="card-header">API Response</div>
                            <div class="card-body">
                                <pre id="api-response" class="api-response mb-0">{}</pre>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/message.js"></script>
</body>
</html>
