<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channels - Communication Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body id="channels-page">
    <div id="alert-container" class="alert-container"></div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/pages/dashboard.html">CommPlatform</a>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white-50">Welcome, <strong id="nav-user" class="text-white">User</strong></span>
                <a href="#" id="logout-btn" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 dashboard-sidebar">
                <h6>Navigation</h6>
                <nav class="nav flex-column sidebar-nav">
                    <a class="nav-link" href="/pages/dashboard.html">Dashboard</a>
                    <a class="nav-link" href="/pages/communities.html">Communities</a>
                    <a class="nav-link active" href="/pages/channels.html">Channels</a>
                    <a class="nav-link" href="/pages/messages.html">Messages</a>
                    <a class="nav-link" href="/pages/files.html">Files</a>
                    <a class="nav-link" href="/pages/search.html">Search</a>
                </nav>
            </div>

            <div class="col-md-9 col-lg-10 page-container">
                <h2 class="mb-4">Channels</h2>

                <div class="row g-4">
                    <div class="col-lg-5">
                        <div class="card content-card">
                            <div class="card-header">Create Channel</div>
                            <div class="card-body">
                                <form id="channel-form">
                                    <div class="mb-3">
                                        <label for="name" class="form-label">Channel Name</label>
                                        <input type="text" class="form-control" id="name" name="name" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="description" class="form-label">Description</label>
                                        <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label for="communityId" class="form-label">Community ID</label>
                                        <input type="number" class="form-control" id="communityId" name="communityId" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Create Channel</button>
                                </form>
                            </div>
                        </div>

                        <div class="card content-card">
                            <div class="card-header">Channels by Community</div>
                            <div class="card-body">
                                <form id="channel-lookup-form">
                                    <div class="mb-3">
                                        <label for="channel-community-id" class="form-label">Community ID</label>
                                        <input type="number" class="form-control" id="channel-community-id" required>
                                    </div>
                                    <button type="submit" class="btn btn-outline-primary">Load Channels</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-7">
                        <div class="card content-card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span>All Channels</span>
                                <button class="btn btn-sm btn-outline-primary" onclick="loadChannels()">Refresh</button>
                            </div>
                            <div class="card-body">
                                <div id="channels-list">
                                    <p class="text-muted mb-0">Loading...</p>
                                </div>
                            </div>
                        </div>

                        <div class="card content-card">
                            <div class="card-header">API Response</div>
                            <div class="card-body">
                                <pre id="api-response" class="api-response mb-0">{}</pre>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/channel.js"></script>
</body>
</html>
