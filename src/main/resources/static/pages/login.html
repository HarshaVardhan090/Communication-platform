<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Communication Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="alert-container" class="alert-container"></div>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">CommPlatform</a>
            <a class="nav-link text-white" href="/pages/register.html">Create Account</a>
        </div>
    </nav>

    <div class="container">
        <div class="card auth-card">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Sign In</h3>
                <form id="login-form">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Don't have an account? <a href="/pages/register.html">Register here</a>
                </p>
            </div>
        </div>

        <div class="card auth-card">
            <div class="card-body p-4">
                <h6 class="mb-3">API Response</h6>
                <pre id="api-response" class="api-response mb-0">{}</pre>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
